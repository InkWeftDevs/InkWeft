// This batch has its own library-test identity; the previous test artifact remains archived.
gradle.beforeProject { project ->
    if (project.path == ':data-local') {
        project.pluginManager.withPlugin('com.android.library') {
            project.android.defaultConfig.testApplicationId = 'org.inkweft.data.storageopt20261011b3r2.test'
        }
    }
}
