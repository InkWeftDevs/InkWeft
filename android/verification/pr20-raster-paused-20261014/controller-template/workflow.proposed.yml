name: PR20 two-source raster screen
'on':
  push:
    branches:
    - codex/kvm-pr20-raster-screen-20261014
    paths:
    - .github/workflows/pr20-raster-screen.yml
permissions:
  contents: read
concurrency:
  group: pr20-raster-screen-20261014
  cancel-in-progress: false
jobs:
  causal:
    name: DIAGNOSTIC_ONLY two sources / five APKs / twelve methods
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/kvm-pr20-raster-screen-20261014'
      && github.event.created == false && github.event.before == '0000000000000000000000000000000000000000'
      && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Fix one local first-step screening clock; no network clock API
      timeout-minutes: 1
      run: "set -euo pipefail\nexport KVM_ONCE=\"$RUNNER_TEMP/pr20-raster-screen\"\
        \nexport ANDROID_AVD_HOME=\"$KVM_ONCE/avd\"\nexport ANDROID_USER_HOME=\"$KVM_ONCE/android-user\"\
        \nexport ANDROID_EMULATOR_HOME=\"$KVM_ONCE/android-user\"\npython3 - <<'PYCODE'\n\
        import json,os,pathlib,time\nobserved=time.time();start=int(observed)\nroot=pathlib.Path(os.environ['KVM_ONCE'])\n\
        assert not root.exists(),'Owned screen directory must be new; do not reuse\
        \ state or clock'\n(root/'evidence').mkdir(parents=True)\ncutoffs={k:start+v*60\
        \ for k,v in [('setup',30),('data',45),('raster',50),('work',55)]}\nvalues={'KVM_BUDGET_ANCHOR':start,'KVM_SETUP_CUTOFF':cutoffs['setup'],'KVM_DATA_CUTOFF':cutoffs['data'],'KVM_RASTER_CUTOFF':cutoffs['raster'],'KVM_WORK_DEADLINE':cutoffs['work']}\n\
        clock={'status':'PASS','scope':'DIAGNOSTIC_ONLY','anchor_kind':'runner_first_step','budget_anchor_epoch':start,'first_step_observed_epoch':observed,'actual_job_started_epoch':None,'deadlines_minutes':[30,45,50,55,60],'deadline_epochs':cutoffs}\n\
        with (root/'evidence/clock.json').open('x') as f:f.write(json.dumps(clock,indent=2)+'\\\
        n')\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n    for k in ['KVM_ONCE','ANDROID_AVD_HOME','ANDROID_USER_HOME','ANDROID_EMULATOR_HOME']:f.write(k+'='+os.environ[k]+'\\\
        n')\n    for k,v in values.items():f.write(k+'='+str(v)+'\\n')\nprint('INKWEFT_CAUSAL_CLOCK\
        \ '+json.dumps(clock,separators=(',',':')))\nPYCODE\n"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      timeout-minutes: 3
      with:
        persist-credentials: false
        path: control
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      timeout-minutes: 3
      with:
        distribution: temurin
        java-version: '17'
    - name: Reconstruct two sources with exactly one production-file delta; official
        dependencies
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))\n\
        test \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py setup\n"
    - name: Build C1 control app and appTest; real native identities
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))\n\
        test \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py build C1\n"
    - name: Build C2 candidate app, appTest and dataTest; real native identities
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))\n\
        test \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py build C2\n"
    - name: 最小临时ACL与同一KVM模拟器
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))\n\
        test \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py emulator\n"
    - name: Two exact C2 cache semantic guards
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_DATA_CUTOFF - $(date +%s) - 2))\ntest\
        \ \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py methods data\n"
    - name: Six C2 owned-Job guards and four paired exploratory diagnostics
      shell: bash
      run: "set -euo pipefail\ncleanup_on_failure() {\n  code=$?\n  trap - EXIT INT\
        \ TERM\n  if test \"$code\" -ne 0; then\n    timeout --signal=TERM --kill-after=2\
        \ 45s python3 control/ci/pr20-raster-screen/cleanup.py trap || code=1\n  fi\n\
        \  exit \"$code\"\n}\ntrap cleanup_on_failure EXIT\ntrap 'exit 130' INT\n\
        trap 'exit 143' TERM\nremaining=$((KVM_RASTER_CUTOFF - $(date +%s) - 2))\n\
        test \"$remaining\" -gt 0\ntimeout --signal=TERM --kill-after=2 \"${remaining}s\"\
        \ python3 control/ci/pr20-raster-screen/run.py methods raster\n"
    - name: 成功路径停止拥有进程并精确恢复ACL
      timeout-minutes: 1
      run: timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-raster-screen/cleanup.py
        trap
    - name: always再次核验进程与ACL恢复
      if: always()
      timeout-minutes: 1
      run: "if test -f control/ci/pr20-raster-screen/cleanup.py; then\n  timeout --signal=TERM\
        \ --kill-after=2 45s python3 control/ci/pr20-raster-screen/cleanup.py always\n\
        else\n  mkdir -p \"$KVM_ONCE/evidence\"\n  echo '{\"emulator\":\"NOT_STARTED\"\
        ,\"command_groups\":\"NOT_STARTED\",\"acl\":\"NOT_TOUCHED\",\"errors\":[]}'\
        \ > \"$KVM_ONCE/evidence/cleanup-always.json\"\nfi\n"
    - name: 只打包白名单原始文本，最大20MiB
      if: always()
      timeout-minutes: 1
      run: "if test -f control/ci/pr20-raster-screen/package.py; then\n  timeout --signal=TERM\
        \ --kill-after=2 45s python3 control/ci/pr20-raster-screen/package.py\nelse\n\
        \  mkdir -p \"$KVM_ONCE/upload\"\n  if test -f \"$KVM_ONCE/evidence/clock.json\"\
        ; then cp \"$KVM_ONCE/evidence/clock.json\" \"$KVM_ONCE/upload/clock.json\"\
        ; fi\n  echo '{\"status\":\"SETUP_BLOCKED_BEFORE_SOURCE_CHECKOUT\",\"tests\"\
        :\"NOT_RUN\",\"kvm\":\"NOT_TOUCHED\"}' > \"$KVM_ONCE/upload/setup-failure.json\"\
        \nfi\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      timeout-minutes: 2
      with:
        name: pr20-raster-screen-${{ github.run_id }}
        retention-days: 3
        if-no-files-found: error
        path: ${{ runner.temp }}/pr20-raster-screen/upload/*
