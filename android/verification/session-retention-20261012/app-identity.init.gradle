gradle.beforeProject { p ->
  if (p.path == ':app') p.pluginManager.withPlugin('com.android.application') {
    p.androidComponents.finalizeDsl { a ->
      a.defaultConfig.applicationId = 'org.inkweft.app.session20261012'
      a.defaultConfig.testApplicationId = 'org.inkweft.app.session20261012.test'
      a.defaultConfig.manifestPlaceholders['appLabel'] = '墨织会话验证'
    }
  }
  if (p.path == ':data-local') p.pluginManager.withPlugin('com.android.library') {
    p.androidComponents.finalizeDsl { a ->
      a.defaultConfig.testApplicationId = 'org.inkweft.data.session20261012.test'
    }
  }
}
