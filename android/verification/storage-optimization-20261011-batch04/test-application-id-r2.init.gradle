// Native SQLite retry has its own identity; retain the first failed artifact.
gradle.beforeProject { project ->
    if (project.path == ':data-local') {
        project.pluginManager.withPlugin('com.android.library') {
            project.android.defaultConfig.testApplicationId = 'org.inkweft.data.storageopt20261011b4r2.test'
        }
    }
}
