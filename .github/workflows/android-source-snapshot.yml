name: Android source snapshot
on:
  pull_request:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/**", "ci/**"]
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/**", "ci/**"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked Android sources without executing project code
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inkweft-source"
          git archive --format=zip --prefix=InkWeft-source/ HEAD android .github ci > "$RUNNER_TEMP/inkweft-source/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/inkweft-source/build-commit.txt"
          printf '%s\n' "$SOURCE_HEAD" > "$RUNNER_TEMP/inkweft-source/source-head.txt"
          cd "$RUNNER_TEMP/inkweft-source"
          sha256sum source.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/inkweft-source/
          retention-days: 7
          if-no-files-found: error
