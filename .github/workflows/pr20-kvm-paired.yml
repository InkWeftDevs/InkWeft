name: PR20 一次性 KVM 四组性能配对
on:
  push:
    branches: [codex/kvm-pr20-paired-20261013-once]
    paths: [.github/workflows/pr20-kvm-paired.yml]
permissions:
  contents: read
concurrency:
  group: pr20-kvm-paired-20261013-once
  cancel-in-progress: false
jobs:
  paired:
    name: PR20 fixed four paired rounds
    if: github.event.created == false && github.event.before == '7821bdd425a579199a60767550f2e9d1ccf808c8' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 从真实job开始时间固定26/55/60分钟边界
        timeout-minutes: 1
        run: |
          set -euo pipefail
          export KVM_ONCE="$RUNNER_TEMP/pr20-kvm-paired"
          export ANDROID_AVD_HOME="$KVM_ONCE/avd"
          export ANDROID_USER_HOME="$KVM_ONCE/android-user"
          export ANDROID_EMULATOR_HOME="$KVM_ONCE/android-user"
          python3 - <<'PYENV'
          import os
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key in ['KVM_ONCE','ANDROID_AVD_HOME','ANDROID_USER_HOME','ANDROID_EMULATOR_HOME']:
                  output.write(key+'='+os.environ[key]+'\n')
          PYENV
          mkdir -p "$KVM_ONCE/evidence"
          python3 - <<'PYCODE'
          import datetime,json,os,pathlib,urllib.request
          # Public read-only metadata, once. No token, retries or fallback if refused.
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
          request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'InkWeft-approved-pair-runner'})
          with urllib.request.urlopen(request,timeout=20) as response: data=json.load(response)
          jobs=[j for j in data['jobs'] if j['name']=='PR20 fixed four paired rounds' and j['status']=='in_progress']
          assert len(jobs)==1,'Cannot resolve this job start; stop without widening budget'
          start=int(datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp())
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'KVM_JOB_STARTED={start}\nKVM_SETUP_CUTOFF={start+26*60}\nKVM_WORK_DEADLINE={start+55*60}\n')
          pathlib.Path(os.environ['KVM_ONCE'],'evidence','clock.json').write_text(json.dumps({'job_id':jobs[0]['id'],'started_epoch':start,'setup_cutoff_epoch':start+26*60,'work_deadline_epoch':start+55*60},indent=2))
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          persist-credentials: false
          path: control
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: '17'
      - name: 冻结并重建两端源码与SDK
        shell: bash
        run: |
          set -euo pipefail
          cleanup_on_failure() {
            code=$?
            trap - EXIT INT TERM
            if test "$code" -ne 0; then
              python3 control/ci/pr20-kvm-paired/cleanup.py trap || code=1
            fi
            exit "$code"
          }
          trap cleanup_on_failure EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          remaining=$((KVM_SETUP_CUTOFF - $(date +%s)))
          test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=20 "${remaining}s" python3 control/ci/pr20-kvm-paired/run.py setup
      - name: 构建B的三个真实debug APK
        shell: bash
        run: |
          set -euo pipefail
