      - name: 成功路径清理并精确恢复ACL
        timeout-minutes: 1
        run: python3 control/ci/pr20-kvm-paired/cleanup.py trap
      - name: always再次核验进程和ACL恢复
        if: always()
        timeout-minutes: 1
        run: |
          if test -f control/ci/pr20-kvm-paired/cleanup.py; then
            python3 control/ci/pr20-kvm-paired/cleanup.py always
          else
            mkdir -p "$KVM_ONCE/evidence"
            echo '{"emulator":"NOT_STARTED","command_groups":"NOT_STARTED","acl":"NOT_TOUCHED","errors":[]}' > "$KVM_ONCE/evidence/cleanup-always.json"
          fi
      - name: 离线计算预设指标并打包不超过20MiB白名单文本
        if: always()
        timeout-minutes: 1
        run: |
          if test -f control/ci/pr20-kvm-paired/package.py; then
            if test -f "$KVM_ONCE/evidence/summary.json"; then
              python3 control/ci/pr20-kvm-paired/analyze.py || echo '{"status":"ANALYSIS_FAILED_KEEP_RAW"}' > "$KVM_ONCE/evidence/analysis-failure.json"
            fi
            python3 control/ci/pr20-kvm-paired/package.py
          else
            mkdir -p "$KVM_ONCE/upload"
            echo '{"status":"SETUP_BLOCKED_BEFORE_SOURCE_CHECKOUT","tests":"NOT_RUN","kvm":"NOT_TOUCHED"}' > "$KVM_ONCE/upload/setup-failure.json"
