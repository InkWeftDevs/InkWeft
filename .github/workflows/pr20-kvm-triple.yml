name: PR20 一次性三端集中原生复验
'on':
  push:
    branches:
    - codex/kvm-pr20-triple-20261013-budget2
    paths:
    - .github/workflows/pr20-kvm-triple.yml
permissions:
  contents: read
concurrency:
  group: pr20-kvm-triple-20261013-budget2
  cancel-in-progress: false
jobs:
  triple:
    name: PR20 fixed three-source native validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/kvm-pr20-triple-20261013-budget2' && github.event.created == false && github.event.before == '2ea991e51b5fed103012d3ee2e5bd94cc1ec6f0d'
      && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: 从真实job开始固定32/38/52/55/60分钟截止
      timeout-minutes: 1
      run: |
        set -euo pipefail
        export KVM_ONCE="$RUNNER_TEMP/pr20-kvm-triple"
        export ANDROID_AVD_HOME="$KVM_ONCE/avd"
        export ANDROID_USER_HOME="$KVM_ONCE/android-user"
        export ANDROID_EMULATOR_HOME="$KVM_ONCE/android-user"
        python3 - <<'PYENV'
        import os
        with open(os.environ['GITHUB_ENV'],'a') as output:
            for key in ['KVM_ONCE','ANDROID_AVD_HOME','ANDROID_USER_HOME','ANDROID_EMULATOR_HOME']:
                output.write(key+'='+os.environ[key]+'\n')
        PYENV
        mkdir -p "$KVM_ONCE/evidence"
        python3 - <<'PYCODE'
        import datetime,json,os,pathlib,urllib.request
        url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
        request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'InkWeft-approved-triple-runner'})
        with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
        jobs=[j for j in data['jobs'] if j['name']=='PR20 fixed three-source native validation' and j['status']=='in_progress']
        assert len(jobs)==1,'Cannot resolve actual job start; stop without widening budget'
        start=int(datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp())
        values={'KVM_JOB_STARTED':start,'KVM_SETUP_CUTOFF':start+32*60,'KVM_CORRECTNESS_CUTOFF':start+38*60,'KVM_COMMON_CUTOFF':start+52*60,'KVM_WORK_DEADLINE':start+55*60}
        with open(os.environ['GITHUB_ENV'],'a') as output:
            for key,value in values.items():output.write(f'{key}={value}\n')
        pathlib.Path(os.environ['KVM_ONCE'],'evidence','clock.json').write_text(json.dumps({'job_id':jobs[0]['id'],'started_epoch':start,'deadlines_minutes':[32,38,52,55,60],'deadline_epochs':values},indent=2))
        PYCODE
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      timeout-minutes: 3
      with:
        persist-credentials: false
        path: control
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      timeout-minutes: 3
      with:
        distribution: temurin
        java-version: '17'
    - name: 冻结并重建B/C0/C1源码与SDK
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py setup
    - name: 构建B的三个真实debug APK
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py build B
    - name: 构建C0的三个真实debug APK
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py build C0
    - name: 构建C1的三个真实debug APK
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py build C1
    - name: 最小临时ACL与同一KVM模拟器
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_SETUP_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py emulator
    - name: C1的17项正确性：失败停止性能部分
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_CORRECTNESS_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py methods correctness
    - name: 四组三端固定顺序的24项公共比较
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_COMMON_CUTOFF - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py methods common
    - name: C1自然GC两种连接及独立阶段诊断
      shell: bash
      run: |
        set -euo pipefail
        cleanup_on_failure() {
          code=$?
          trap - EXIT INT TERM
          if test "$code" -ne 0; then
            timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap || code=1
          fi
          exit "$code"
        }
        trap cleanup_on_failure EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        remaining=$((KVM_WORK_DEADLINE - $(date +%s) - 2))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=2 "${remaining}s" python3 control/ci/pr20-kvm-triple/run.py methods diagnostics
    - name: 成功路径停止拥有进程并精确恢复ACL
      timeout-minutes: 1
      run: timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py trap
    - name: always再次核验进程与ACL恢复
      if: always()
      timeout-minutes: 1
      run: |
        if test -f control/ci/pr20-kvm-triple/cleanup.py; then
          timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/cleanup.py always
        else
          mkdir -p "$KVM_ONCE/evidence"
          echo '{"emulator":"NOT_STARTED","command_groups":"NOT_STARTED","acl":"NOT_TOUCHED","errors":[]}' > "$KVM_ONCE/evidence/cleanup-always.json"
        fi
    - name: 只打包白名单原始文本，最大20MiB
      if: always()
      timeout-minutes: 1
      run: |
        if test -f control/ci/pr20-kvm-triple/package.py; then
          timeout --signal=TERM --kill-after=2 45s python3 control/ci/pr20-kvm-triple/package.py
        else
          mkdir -p "$KVM_ONCE/upload"
          echo '{"status":"SETUP_BLOCKED_BEFORE_SOURCE_CHECKOUT","tests":"NOT_RUN","kvm":"NOT_TOUCHED"}' > "$KVM_ONCE/upload/setup-failure.json"
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      timeout-minutes: 2
      with:
        name: pr20-kvm-triple-${{ github.run_id }}
        retention-days: 3
        if-no-files-found: error
        path: ${{ runner.temp }}/pr20-kvm-triple/upload/*
