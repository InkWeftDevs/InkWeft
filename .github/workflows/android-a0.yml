name: Android 按改动验证
on:
  push:
    branches: ["main"]
    paths: ["android/**", "ci/**", "backup-server/**", "sync-lab/**", "resource-packs/**", ".github/workflows/android-a0.yml"]
  pull_request:
    branches: ["main"]
    paths: ["android/**", "ci/**", "backup-server/**", "sync-lab/**", "resource-packs/**", ".github/workflows/android-a0.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: 验证范围
        type: choice
        options: [full]
        default: full
permissions:
  contents: read
  actions: read
concurrency:
  group: android-a0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 构建与静态检查
    outputs:
      tls: ${{ steps.plan.outputs.tls }}
      device: ${{ steps.plan.outputs.device }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_inkweftDiagnosticBuild: "true"
      ORG_GRADLE_PROJECT_inkweftInsertionPreview: "true"
      INKWEFT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 验证 GitHub Actions 工作流语义
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: 验证检查选择规则
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: 选择本次验证范围
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/select_android_scope.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.plan.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: 验证合成备份协议与账号隔离
        if: steps.plan.outputs.backup == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/pip" install -r backup-server/requirements.txt
          cd backup-server
          "$RUNNER_TEMP/backup-venv/bin/python" -m unittest discover -v -p 'test_*.py'
      - name: 验证声明式资源与合成同步实验
        if: steps.plan.outputs.experiments == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/experiments-venv"
          "$RUNNER_TEMP/experiments-venv/bin/pip" install -r backup-server/requirements.txt
          "$RUNNER_TEMP/experiments-venv/bin/python" -m unittest discover -s sync-lab -v
          python3 resource-packs/pack.py resource-packs/paper --output "$RUNNER_TEMP/paper.iwpack"
          python3 resource-packs/pack.py resource-packs/map --output "$RUNNER_TEMP/map.iwpack"
      - name: 隔离容器权限与持久卷核验
        if: steps.plan.outputs.backup == 'true'
        run: |
          mkdir -p android/build/evidence
          python3 backup-server/container_check.py --output android/build/evidence/container-check.json
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.plan.outputs.build == 'true'
        with:
          gradle-version: "9.4.1"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.plan.outputs.build == 'true'
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: 安装编译 SDK
        if: steps.plan.outputs.build == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: 按范围构建与静态检查
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd android
          gradle --no-daemon wrapper
          printf '%s  %s\n' '55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check -
          cd ..
          python3 - <<'PY'
          import json, subprocess
          p=json.load(open('android-plan.json'))
          tasks=[]
          if p['core']: tasks+=[':core-domain:test']
          if p['lint']: tasks+=[':app:lintDebug']
          if p['app']: tasks+=[':app:assembleDebug',':app:assembleDebugAndroidTest']
          if p['room']: tasks+=[':data-local:assembleDebugAndroidTest']
          subprocess.run(['./gradlew','--no-daemon','--build-cache',*tasks],cwd='android',check=True)
          PY
          git diff --exit-code -- android/data-local/schemas
          test -z "$(git ls-files --others --exclude-standard -- android/data-local/schemas)"
      - name: 记录构件与签名
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p android/build/evidence
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            apk=android/app/build/outputs/apk/debug/app-debug.apk
            sha256sum "$apk" > android/build/evidence/APK-SHA256.txt
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > android/build/evidence/apk-signature.txt
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk" > android/build/evidence/zip-alignment.txt
            cp android/app/build/outputs/apk/debug/output-metadata.json android/build/evidence/
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" res/xml/network_security_config.xml > android/build/evidence/network-security-config.txt
            python3 -c 'import zipfile; z=zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk"); assert not any("fixture_ca" in n for n in z.namelist()); assert b"fixture_ca" not in z.read("resources.arsc")'
          fi
          git rev-parse HEAD > android/build/evidence/build-commit.txt
          printf '%s\n' "$INKWEFT_HEAD_SHA" > android/build/evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-build-verification-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android-plan.json
            android/core-domain/build/test-results/
            android/app/build/reports/lint-results*
            android/app/build/outputs/apk/debug/app-debug.apk
            android/build/evidence/
      - name: 保存设备测试输入
        if: steps.plan.outputs.device == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-inputs-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            android-plan.json
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/data-local/build/outputs/apk/androidTest/debug/data-local-debug-androidTest.apk
  device:
    name: 设备回归 ${{ matrix.shard }}
    needs: build
    if: needs.build.outputs.device == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-test-inputs-${{ github.run_id }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install emulator test image
        run: sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Start disposable tablet emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/inkweft-avd
          ANDROID_USER_HOME: ${{ runner.temp }}/inkweft-android-user
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/inkweft-android-user
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" android/build/evidence
          printf 'no\n' | avdmanager create avd --force --name inkweft-ci --path "$ANDROID_AVD_HOME/inkweft-ci.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee android/build/evidence/avd-list.txt
          grep -Fx inkweft-ci android/build/evidence/avd-list.txt
          nohup "$ANDROID_HOME/emulator/emulator" -avd inkweft-ci -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on > android/build/evidence/emulator.log 2>&1 &
          echo $! > android/build/evidence/emulator.pid
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82
          adb shell wm size 1920x1200
          adb shell wm density 240
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop > android/build/evidence/emulator-properties.txt
      - name: 单次运行选定测试并保存证据
        # Each shard owns a loopback-only, synthetic service. No repository/private library is uploaded.
        env:
          BACKUP_FIXTURE_ROOT: ${{ runner.temp }}/backup-fixture
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("android-plan.json"))["backup"] else 1)'; then
            python3 -m venv "$RUNNER_TEMP/backup-venv"
            "$RUNNER_TEMP/backup-venv/bin/pip" install -r backup-server/requirements.txt
            nohup "$RUNNER_TEMP/backup-venv/bin/python" backup-server/fixture.py --directory "$BACKUP_FIXTURE_ROOT" > "$RUNNER_TEMP/backup-service.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/backup-service.pid"
            python3 -c 'import time,urllib.request; exec("for i in range(40):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:18751/v1/identity\",timeout=1);break\n except Exception:\n  time.sleep(.25)\nelse: raise RuntimeError(\"backup fixture unavailable\")")'
            adb reverse tcp:18751 tcp:18751
          fi
          python3 ci/run_android_tests.py --shard-index ${{ matrix.shard }} --shard-count ${{ needs.build.outputs.shard_count }}
      - name: 收集失败线索并关闭模拟器
        if: always()
        run: |
          mkdir -p android/build/evidence
          if [ -f "$RUNNER_TEMP/backup-service.pid" ]; then kill "$(cat "$RUNNER_TEMP/backup-service.pid")" || true; fi
          if adb get-state >/dev/null 2>&1; then
            adb logcat -d -t 1500 > android/build/evidence/emulator-logcat.txt
            adb pull /sdcard/Android/data/org.inkweft.app.a0.insertion/files/. android/build/evidence/ || true
            adb emu kill || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-verification-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android-plan.json
            android/build/evidence/

  tls:
    name: 官方 Android 隔离 TLS 门禁
    needs: build
    if: needs.build.outputs.tls == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_inkweftInsertionPreview: "true"
      INKWEFT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.4.1"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: 构建专用信任源集
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          python3 -m venv "$RUNNER_TEMP/tls-venv"
          "$RUNNER_TEMP/tls-venv/bin/pip" install -r backup-server/requirements.txt
          "$RUNNER_TEMP/tls-venv/bin/python" backup-server/tls_fixture.py --directory "$RUNNER_TEMP/tls-fixture" --generate-only
          gradle -p android --no-daemon -PinkweftTlsFixture="$RUNNER_TEMP/tls-fixture/res" :app:assembleTlsProbe :app:assembleTlsProbeAndroidTest
      - name: 启动隔离证书夹具与干净系统
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/tls-avd
          ANDROID_USER_HOME: ${{ runner.temp }}/tls-user
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/tls-user
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" android/build/tls-evidence
          sudo chmod 666 /dev/kvm
          printf 'no\n' | avdmanager create avd --force --name inkweft-tls --package "system-images;android-35;google_apis;x86_64" --device pixel_2
          nohup "$ANDROID_HOME/emulator/emulator" -avd inkweft-tls -port 5554 -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/tls-emulator.log" 2>&1 &
          nohup "$RUNNER_TEMP/tls-venv/bin/python" backup-server/tls_fixture.py --directory "$RUNNER_TEMP/tls-fixture" > "$RUNNER_TEMP/tls-service.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tls-service.pid"
          timeout 240 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb -s emulator-5554 shell input keyevent 82
      - name: 运行五项正负例并核对服务端计数
        run: '"$RUNNER_TEMP/tls-venv/bin/python" ci/run_tls_probe.py --serial emulator-5554 --fixture "$RUNNER_TEMP/tls-fixture" --output android/build/tls-evidence'
      - name: 关闭本任务服务
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tls-service.pid" ]; then kill "$(cat "$RUNNER_TEMP/tls-service.pid")" || true; fi
          adb -s emulator-5554 emu kill || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-tls-verification-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: android/build/tls-evidence/
