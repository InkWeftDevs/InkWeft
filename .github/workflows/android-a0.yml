name: Android workspace and native ink
on:
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-a0.yml"]
  pull_request:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-a0.yml"]
permissions:
  contents: read
concurrency:
  group: android-a0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_inkweftDiagnosticBuild: "true"
      INKWEFT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.4.1"
          cache-read-only: true
      - name: Provision SDK tools explicitly
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install declared SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate verified standard wrapper and build
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper
          printf '%s  %s\n' '55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check -
          ./gradlew --no-daemon :core-domain:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :data-local:assembleDebugAndroidTest
          git diff --exit-code -- data-local/schemas
          test -z "$(git ls-files --others --exclude-standard -- data-local/schemas)"
      - name: Record actual APK provenance
        working-directory: android
        env:
          BUILD_COMMIT: ${{ github.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          cp app/build/outputs/apk/debug/app-debug.apk build/evidence/inkweft-a3-editing-debug.apk
          sha256sum build/evidence/inkweft-a3-editing-debug.apk > build/evidence/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/evidence/inkweft-a3-editing-debug.apk > build/evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/evidence/inkweft-a3-editing-debug.apk > build/evidence/zip-alignment.txt
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          metadata=json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          assert metadata['applicationId']=='org.inkweft.app.a0.workspace'
          Path("build/evidence/build.json").write_text(json.dumps({
            "commit": os.environ["BUILD_COMMIT"], "pr_head": os.environ["HEAD_COMMIT"],
            "scope": "A3_LOCAL_ERASER_MULTIPAGE_COVER_RENAME_NOT_FULL_G1_OR_S1",
            "compileSdk": 36, "targetSdk": 36, "minSdk": 31,
            "applicationId": metadata['applicationId'], "versionName": metadata['elements'][0]['versionName'],
            "inkVersion": "1.0.0", "runner": platform.platform(), "instrumented_tests": "SEE_RUNTIME_REPORT",
            "physical_device": "NOT_RUN", "pencil3": "NOT_RUN", "long_stroke_checkpoints": "NOT_IMPLEMENTED",
            "restart_undo_history": "NOT_IMPLEMENTED", "plan_37_acceptance_cases": "NOT_RUN",
            "handwriting_recognition": "NOT_IMPLEMENTED_MANUAL_INDEX_ONLY"
          }, indent=2) + "\n")
          PY
      - name: Upload built APK and schema before device checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inkweft-a3-editing-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android/build/evidence/
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/
            android/data-local/schemas/
      - name: Install emulator test image
        run: sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Start disposable tablet emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/inkweft-avd
          ANDROID_USER_HOME: ${{ runner.temp }}/inkweft-android-user
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/inkweft-android-user
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" android/build/evidence
          printf 'no\n' | avdmanager create avd --force --name inkweft-ci --path "$ANDROID_AVD_HOME/inkweft-ci.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee android/build/evidence/avd-list.txt
          grep -Fx inkweft-ci android/build/evidence/avd-list.txt
          nohup "$ANDROID_HOME/emulator/emulator" -avd inkweft-ci -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on > android/build/evidence/emulator.log 2>&1 &
          echo $! > android/build/evidence/emulator.pid
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82
          adb shell wm size 1920x1200
          adb shell wm density 240
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop > android/build/evidence/emulator-properties.txt
      - name: Run real Room and Compose instrumented tests
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :data-local:connectedDebugAndroidTest :app:connectedDebugAndroidTest
          # Gates derived from the JUnit XML that was actually produced. No test total
          # is written by hand, no assertion is removed, and no continue-on-error is used.
          python3 - <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          expected_totals = {":data-local": 31, ":app": 18}
          roots = {
              ":data-local": glob.glob("data-local/build/outputs/androidTest-results/**/*.xml",
                                       recursive=True),
              ":app": glob.glob("app/build/outputs/androidTest-results/**/*.xml",
                                recursive=True),
          }
          failed = False
          for module, paths in roots.items():
              tests = failures = errors = skipped = 0
              for path in paths:
                  root = ET.parse(path).getroot()
                  suites = ([root] if root.tag == "testsuite"
                            else root.findall(".//testsuite"))
                  for suite in suites:
                      tests += int(suite.get("tests") or 0)
                      failures += int(suite.get("failures") or 0)
                      errors += int(suite.get("errors") or 0)
                      skipped += int(suite.get("skipped") or 0)
              print(f"{module}: xml_files={len(paths)} tests={tests} "
                    f"failures={failures} errors={errors} skipped={skipped}")
              if not paths:
                  print(f"{module}: NO JUNIT XML PRODUCED", file=sys.stderr)
                  failed = True
              if failures or errors:
                  failed = True
              if skipped:
                  print(f"{module}: {skipped} test(s) skipped - must be explained",
                        file=sys.stderr)
                  failed = True
              if tests < expected_totals[module]:
                  print(f"{module}: saw {tests} tests, expected at least "
                        f"{expected_totals[module]}", file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print("instrumented suites complete: 0 failures, 0 errors, 0 skipped")
          PY
          printf '%s\n' 'Instrumented tasks completed on the CI emulator. Not Pencil3 or physical-device evidence. See actual JUnit XML.' > build/evidence/instrumentation-completed.txt
      - name: Capture actual workspace screenshots and diagnostic output
        working-directory: android
        run: |
          set -euo pipefail
          # Explicit disposable CI install, never a user device or user-data reset.
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 240 adb shell am instrument -w org.inkweft.app.a0.workspace.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r' | tee build/evidence/evidence-capture-instrumentation.txt
          # The previous workflow asserted the literal "OK (8 tests)" from the retired
          # A2 capture run. File counts are recorded as measurements instead, and the
          # zero-failure and suite-size gates below are derived from the actual XML.
          adb shell "ls '/sdcard/Android/data/org.inkweft.app.a0.workspace/files'" | tr -d '\r' > build/evidence/device-evidence-files.txt || true
          adb pull "/sdcard/Android/data/org.inkweft.app.a0.workspace/files/." "build/evidence/" || true
          test -f build/evidence/ink-ui-emulator.png
          test -f build/evidence/diagnostics-emulator.zip
          test -f build/evidence/workspace-library.png
          test -f build/evidence/workspace-board.png
          test -f build/evidence/workspace-page.png
          test -f build/evidence/workspace-narrow.png
          ls -1 build/evidence | sort > build/evidence/evidence-file-list.txt
          printf '%s\n' 'UI artifacts captured for on-device verification only, not additional unique tests. Actual device and real share-target remain NOT_RUN.' > build/evidence/evidence-capture-scope.txt
      - name: Capture emulator logs
        if: always()
        run: |
          mkdir -p android/build/evidence
          if adb get-state >/dev/null 2>&1; then
            adb logcat -d -t 1500 > android/build/evidence/emulator-logcat.txt
            adb emu kill || true
          fi
      - name: Upload all actually existing test and runtime reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-a3-reports-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/core-domain/build/test-results/
            android/core-domain/build/reports/tests/
            android/app/build/reports/lint-results*
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/data-local/build/outputs/androidTest-results/
            android/data-local/build/reports/androidTests/
            android/build/evidence/
