name: 六批定向云端验证
on:
  push:
    branches: ["codex/cloud/six-batches-v11-20261004"]
    paths:
      - "android/**/src/**"
      - "android/**/build.gradle.kts"
      - "android/data-local/schemas/**"
      - "android/gradle/**"
      - "android/gradle.properties"
      - "android/settings.gradle.kts"
      - "ci/run_android_tests.py"
      - "ci/six_batch_scope.py"
      - ".github/workflows/android-six-batches.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: inkweft-six-batches-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_inkweftInsertionPreview: "true"
      INKWEFT_HEAD_SHA: ${{ github.sha }}
      ANDROID_AVD_HOME: ${{ runner.temp }}/inkweft-six-batch-avd
      ANDROID_USER_HOME: ${{ runner.temp }}/inkweft-six-batch-android
      ANDROID_EMULATOR_HOME: ${{ runner.temp }}/inkweft-six-batch-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: 核验既有虚拟化权限（不修改权限或安全设置）
        id: acceleration
        run: |
          mkdir -p android/build/evidence
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"EXISTING_KVM_ACCESS"}' > android/build/evidence/device-environment.json
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"BLOCKED_KVM_ACCESS","methods_started":0}' > android/build/evidence/device-environment.json
          fi
      - name: 安装官方编译组件并锁定本批范围
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python3 ci/six_batch_scope.py
          python3 -m unittest discover -s ci -p 'test_*.py'
      - name: 串行定向构建（模拟器尚未启动）
        run: |
          python3 - <<'PY'
          import json, subprocess
          p=json.load(open('android-plan.json'))
          command=['./gradlew','--no-daemon','--max-workers=1','-Pkotlin.compiler.execution.strategy=in-process',
                   '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8',':core-domain:test']
          for name in p['core_classes']: command+=['--tests',name]
          command+=[':app:lintDebug',':app:assembleDebug',':app:assembleDebugAndroidTest',':data-local:assembleDebugAndroidTest']
          subprocess.run(command,cwd='android',check=True)
          PY
          git diff --exit-code -- android/data-local/schemas
          test -z "$(git ls-files --others --exclude-standard -- android/data-local/schemas)"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/data-local/build/outputs/apk/androidTest/debug/data-local-debug-androidTest.apk > android/build/evidence/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/build/evidence/apk-signature.txt
          git rev-parse HEAD > android/build/evidence/source-commit.txt
      - name: 仅使用已可访问KVM启动隔离AOSP平板
        if: steps.acceleration.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | avdmanager create avd --name inkweft-six-batch --package "system-images;android-35;default;x86_64" --device pixel_2
          nohup "$ANDROID_HOME/emulator/emulator" -avd inkweft-six-batch -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/inkweft-emulator.log" 2>&1 &
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb shell input keyevent 82
          adb shell wm size 1920x1200
          adb shell wm density 240
      - name: 执行合成Room与原生UI回归
        if: steps.acceleration.outputs.ready == 'true'
        run: python3 ci/run_android_tests.py
      - name: 如实记录没有设备运行
        if: steps.acceleration.outputs.ready != 'true'
        run: |
          echo 'Android methods NOT_RUN: existing runner permissions do not allow KVM. No permissions were changed.'
          exit 1
      - name: 关闭本任务模拟器
        if: always()
        run: adb emu kill || true
      - name: 仅保存验证回执与合成像素（无APK）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-batches-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            android-plan.json
            android/core-domain/build/test-results/test/TEST-*.xml
            android/app/build/reports/lint-results-debug.xml
            android/build/evidence/*-summary.json
            android/build/evidence/device-environment.json
            android/build/evidence/APK-SHA256.txt
            android/build/evidence/apk-signature.txt
            android/build/evidence/source-commit.txt
            android/build/evidence/**/b1-card-four-zones.png
