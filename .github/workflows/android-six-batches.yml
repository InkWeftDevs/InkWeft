name: 六批定向云端验证
on:
  push:
    branches: ["codex/cloud/six-batches-v11-20261004"]
    paths:
      - "android/**/src/**"
      - "android/**/build.gradle.kts"
      - "android/data-local/schemas/**"
      - "android/gradle/**"
      - "android/gradle.properties"
      - "android/settings.gradle.kts"
      - "ci/**"
      - "android/verification/six-batch-fixture-20261004/run-fixture.py"
      - "android/verification/six-batch-fixture-20261004/test_*.py"
      - ".github/workflows/android-six-batches.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: focused反馈当前阻塞；full执行完整六批验收
        type: choice
        options: [focused, full]
        default: focused
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: inkweft-six-batches-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: ${{ (inputs.mode == 'full' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[six-batches-full]'))) && 'full' || 'focused' }} 验证分片 ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((inputs.mode == 'full' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[six-batches-full]'))) && '[0, 1, 2]' || '[0]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_inkweftInsertionPreview: "true"
      INKWEFT_MODE: ${{ (inputs.mode == 'full' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[six-batches-full]'))) && 'full' || 'focused' }}
      INKWEFT_HEAD_SHA: ${{ github.sha }}
      INKWEFT_SHARD_INDEX: ${{ matrix.shard }}
      INKWEFT_SHARD_COUNT: ${{ strategy.job-total }}
    steps:
      - name: 预留最后180秒清理上传并限制固定样本预算
        run: echo "INKWEFT_FIXTURE_DEADLINE=$(( $(date +%s) + 45*60 - 180 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      # setup-gradle writes separate derived caches despite home-cache includes.
      # Disable all remote caching; retain official wrapper validation only.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          validate-wrappers: true
          add-job-summary: on-failure
      - name: 初始化本次任务的临时目录
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/inkweft-six-batch-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/inkweft-six-batch-android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/inkweft-six-batch-android" >> "$GITHUB_ENV"
      - name: 为当前临时runner用户临时授权KVM（用户已确认）
        run: |
          set -euo pipefail
          test -c /dev/kvm
          command -v getfacl
          command -v setfacl
          getfacl -p /dev/kvm > "$RUNNER_TEMP/inkweft-kvm-before.acl"
          stat -c '%d:%i:%t:%T' /dev/kvm > "$RUNNER_TEMP/inkweft-kvm-identity"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          getfacl -p /dev/kvm
      - name: 核验当前用户KVM访问并记录设备环境
        id: acceleration
        run: |
          mkdir -p android/build/evidence
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"EXISTING_KVM_ACCESS"}' > android/build/evidence/device-environment.json
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"BLOCKED_KVM_ACCESS","methods_started":0}' > android/build/evidence/device-environment.json
          fi
      - name: 安装官方编译组件并锁定本批范围
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python3 ci/six_batch_scope.py --mode "$INKWEFT_MODE"
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 -m unittest discover -s android/verification/six-batch-fixture-20261004 -p 'test_*.py'
      - name: 明确记录Room与固定样本只分配给0号分片
        if: matrix.shard != 0
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path('android-plan.json').read_text())
          out=Path('android/build/evidence'); out.mkdir(parents=True,exist_ok=True)
          for key,total in [('room',plan['expected_room']),('fixture',plan['fixture']['expected_methods'])]:
              summary={'status':'NOT_ASSIGNED','source_commit':os.environ['INKWEFT_HEAD_SHA'],
                       'shard_index':int(os.environ['INKWEFT_SHARD_INDEX']),
                       'shard_count':int(os.environ['INKWEFT_SHARD_COUNT']),'assigned_shard':0,
                       'expected':0,'planned_total':total,'passed':0,'failures':[],'infrastructure':[]}
              if key=='fixture': summary['phases']={phase:{'status':'NOT_ASSIGNED'} for phase in plan['fixture']['phases']}
              (out/f'{key}-summary.json').write_text(json.dumps(summary,indent=2))
          PY
      - name: 本片独立串行构建（模拟器尚未启动）
        id: build
        run: |
          test "$(git rev-parse HEAD)" = "$INKWEFT_HEAD_SHA"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          from six_batch_scope import lint_requirement
          p=json.load(open('android-plan.json'))
          shard=int(os.environ['INKWEFT_SHARD_INDEX'])
          lint_gate=lint_requirement(p['mode'],shard)
          command=['./gradlew','--no-daemon','--max-workers=1','-Pkotlin.compiler.execution.strategy=in-process',
                   '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8',':core-domain:test']
          for name in p['core_classes']: command+=['--tests',name]
          if lint_gate=='RUN_REQUIRED': command+=[':app:lintDebug']
          command+=[':app:assembleDebug',':app:assembleDebugAndroidTest',':data-local:assembleDebugAndroidTest']
          subprocess.run(command,cwd='android',check=True)
          Path('android/build/evidence/build-summary.json').write_text(json.dumps({
              'mode':p['mode'],'core':'PASS','apk_build':'PASS',
              'shard_index':shard,'required_full_lint_shard':1,
              'lint':'PASS' if lint_gate=='RUN_REQUIRED' else lint_gate},indent=2))
          PY
          git diff --exit-code -- android/data-local/schemas
          test -z "$(git ls-files --others --exclude-standard -- android/data-local/schemas)"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/data-local/build/outputs/apk/androidTest/debug/data-local-debug-androidTest.apk > android/build/evidence/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/build/evidence/apk-signature.txt
          git rev-parse HEAD > android/build/evidence/source-commit.txt
      - name: 仅使用已获准的KVM访问启动隔离AOSP平板
        id: emulator
        if: steps.acceleration.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | avdmanager create avd --name inkweft-six-batch --package "system-images;android-35;default;x86_64" --device pixel_2
          nohup "$ANDROID_HOME/emulator/emulator" -avd inkweft-six-batch -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/inkweft-emulator.log" 2>&1 &
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb shell input keyevent 82
          adb shell wm size 1920x1200
          adb shell wm density 240
      - name: 执行合成Room与原生UI回归
        id: regression
        if: steps.acceleration.outputs.ready == 'true'
        run: python3 ci/run_android_tests.py --shard-index "$INKWEFT_SHARD_INDEX" --shard-count "$INKWEFT_SHARD_COUNT"
      - name: 提前保存定向回归终态以便与固定样本并行诊断
        if: ${{ !cancelled() && (steps.regression.outcome == 'success' || steps.regression.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-batches-regression-${{ github.sha }}-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            android-plan.json
            android/build/evidence/app-summary.json
            android/build/evidence/room-summary.json
            android/build/evidence/room-input-evidence.json
            android/build/evidence/build-summary.json
            android/build/evidence/fixture-summary.json
            android/build/evidence/scope.json
            android/build/evidence/APK-SHA256.txt
            android/build/evidence/source-commit.txt
            android/build/evidence/**/instrumentation.txt
            android/build/evidence/**/selection.txt
            android/build/evidence/app-*/outline-input-route.txt
            android/build/evidence/app-*/selection-capture-failure.txt
            android/build/evidence/app-*/selection-capture-failure.png
            android/build/evidence/app-*/recall-source-wait-failure.txt
            android/build/evidence/app-*/recall-source-wait-failure.png
            android/build/evidence/app-*/recall-source-wait-logcat.txt
            android/build/evidence/app-*/mui-map-interaction-failure.txt
            android/build/evidence/app-*/mui-map-interaction-failure.png
            android/build/evidence/app-*/inline-recreate-failure.txt
            android/build/evidence/app-*/inline-recreate-failure.png
            android/build/evidence/app-*/ls58-learning-map-entry-failure.txt
            android/build/evidence/app-*/ls58-learning-map-entry-failure.png
            android/build/evidence/app-*/excerpt-ready-failure.txt
            android/build/evidence/app-*/excerpt-ready-failure.png
            android/build/evidence/app-*/excerpt-comment-failure.txt
            android/build/evidence/app-*/excerpt-comment-failure.png
            android/build/evidence/app-*/timeout-screen.png
            android/build/evidence/app-*/timeout-diagnostics.json
            android/build/evidence/app-*/timeout-app-logcat.txt
            android/build/evidence/app-*/timeout-app-threads.txt
            android/build/evidence/app-*/timeout-app-backtrace.txt
      - name: 同一固定大样本准备、冷重开、原生界面及持久回忆取证
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.emulator.outcome == 'success' && steps.acceleration.outputs.ready == 'true' && matrix.shard == 0 }}
        run: python3 ci/run_six_batch_fixture.py --mode "$INKWEFT_MODE" --deadline-epoch "$INKWEFT_FIXTURE_DEADLINE" --source-commit "$INKWEFT_HEAD_SHA"
      - name: 如实记录固定大样本没有运行
        if: ${{ !cancelled() && (steps.build.outcome != 'success' || steps.emulator.outcome != 'success' || steps.acceleration.outputs.ready != 'true') && matrix.shard == 0 }}
        run: python3 ci/run_six_batch_fixture.py --mode "$INKWEFT_MODE" --deadline-epoch "$INKWEFT_FIXTURE_DEADLINE" --source-commit "$INKWEFT_HEAD_SHA" --not-run "Build=${{ steps.build.outcome }}; emulator=${{ steps.emulator.outcome }}; KVM=${{ steps.acceleration.outputs.ready }}"
      - name: 如实记录没有设备运行
        if: steps.acceleration.outputs.ready != 'true'
        run: |
          echo 'Android methods NOT_RUN: existing runner permissions do not allow KVM. See the temporary current-user ACL grant and restoration steps.'
          exit 1
      - name: 关闭本任务模拟器
        if: always()
        run: adb emu kill || true
      - name: 恢复KVM原ACL并核验（包括原有当前UID条目）
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/inkweft-kvm-before.acl"; then
            test -c /dev/kvm
            test "$(stat -c '%d:%i:%t:%T' /dev/kvm)" = "$(cat "$RUNNER_TEMP/inkweft-kvm-identity")"
            sudo setfacl --restore="$RUNNER_TEMP/inkweft-kvm-before.acl"
            getfacl -p /dev/kvm > "$RUNNER_TEMP/inkweft-kvm-after.acl"
            cmp "$RUNNER_TEMP/inkweft-kvm-before.acl" "$RUNNER_TEMP/inkweft-kvm-after.acl"
            mkdir -p android/build/evidence
            printf '%s\n' '{"status":"RESTORED_EXACT_ORIGINAL_ACL"}' > android/build/evidence/kvm-acl-restoration.json
          fi
      # Each shard builds its own APKs from the same source. Its hashes identify only its own evidence.
      - name: 仅保存本片验证回执与合成像素（无APK）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-batches-verification-${{ github.sha }}-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            android-plan.json
            android/core-domain/build/test-results/test/TEST-*.xml
            android/app/build/reports/lint-results-debug.xml
            android/build/evidence/*-summary.json
            android/build/evidence/room-input-evidence.json
            android/build/evidence/device-environment.json
            android/build/evidence/kvm-acl-restoration.json
            android/build/evidence/APK-SHA256.txt
            android/build/evidence/apk-signature.txt
            android/build/evidence/source-commit.txt
            android/build/evidence/scope.json
            android/build/evidence/app-*/**/*.png
            android/build/evidence/**/instrumentation.txt
            android/build/evidence/**/selection.txt
            android/build/evidence/app-*/outline-input-route.txt
            android/build/evidence/app-*/selection-capture-failure.txt
            android/build/evidence/app-*/selection-capture-failure.png
            android/build/evidence/app-*/recall-source-wait-failure.txt
            android/build/evidence/app-*/recall-source-wait-failure.png
            android/build/evidence/app-*/recall-source-wait-logcat.txt
            android/build/evidence/app-*/mui-map-interaction-failure.txt
            android/build/evidence/app-*/mui-map-interaction-failure.png
            android/build/evidence/app-*/inline-recreate-failure.txt
            android/build/evidence/app-*/inline-recreate-failure.png
            android/build/evidence/app-*/ls58-learning-map-entry-failure.txt
            android/build/evidence/app-*/ls58-learning-map-entry-failure.png
            android/build/evidence/app-*/excerpt-ready-failure.txt
            android/build/evidence/app-*/excerpt-ready-failure.png
            android/build/evidence/app-*/excerpt-comment-failure.txt
            android/build/evidence/app-*/excerpt-comment-failure.png
            android/build/evidence/app-*/timeout-screen.png
            android/build/evidence/app-*/timeout-diagnostics.json
            android/build/evidence/app-*/timeout-app-logcat.txt
            android/build/evidence/app-*/timeout-app-threads.txt
            android/build/evidence/app-*/timeout-app-backtrace.txt
            android/build/evidence/six-batch-fixture/setup.txt
